name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.2'
  # 必须与 package.json 的 packageManager 字段完全一致
  PNPM_VERSION: '10.34.9'

jobs:
  verify:
    name: 安装 / lint / typecheck / test / build / 许可证
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 认证集成测试需要真实 PostgreSQL（不使用 mock 替代数据库测试）。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novel
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: novel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel -d novel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://novel:ci-placeholder@127.0.0.1:5432/novel?schema=public

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 使用 corepack 安装与 package.json packageManager 完全一致的 pnpm 版本
      - name: 启用 corepack 并安装指定 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 必须先构建库包：web / worker 通过 workspace 依赖引用
      # @novel/shared、@novel/db、@novel/auth 的 dist 产物，
      # lint / typecheck / test 都依赖它。
      - name: 生成 Prisma Client 并构建库包
        run: pnpm build:packages

      # 集成测试直接连真实数据库，必须先应用迁移。
      - name: 应用数据库迁移
        run: pnpm db:deploy

      - name: 校验格式（构建前）
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试与数据库集成测试
        run: pnpm test

      - name: 符号链接分类校验器的行为测试
        run: pnpm test:deploy-symlinks

      # 纯文本断言，不需要 Docker：防止把「先迁移再起四服务」的顺序改回去。
      - name: CI 启动顺序守卫（无需 Docker）
        run: |
          set -euo pipefail
          pnpm check:ci-order
          pnpm test:ci-order

      - name: 构建应用
        run: pnpm build:apps

      - name: 校验格式（构建后，防止 Next 重写文件导致回归）
        run: pnpm format:check

      - name: 校验构建后 Git 工作区未被污染
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建过程修改了被跟踪文件，请检查 Next/Prisma 是否重写了源文件："
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
          echo "Git 工作区干净 ✓"

      - name: Docker Compose 配置校验
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD=ci-placeholder docker compose -f infra/docker-compose.yml config --quiet
          POSTGRES_PASSWORD=ci-placeholder docker compose -f infra/docker-compose.yml config > /dev/null

      - name: 依赖许可证扫描（生产依赖 + 开发依赖）
        run: |
          set -euo pipefail
          pnpm license:check
          pnpm license:check:dev

      - name: 生成第三方许可证清单
        run: |
          set -euo pipefail
          pnpm license:report
          pnpm license:report:dev

      - name: 上传许可证清单
        uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: |
            THIRD_PARTY_LICENSES.md
            THIRD_PARTY_LICENSES.dev.md

  docker:
    name: 容器构建与端到端健康验证
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    env:
      # 独立 Compose 项目名：容器/网络/卷均带此前缀，
      # 与任何开发环境隔离；down -v 只清理本次运行创建的资源。
      COMPOSE_PROJECT_NAME: novel-ci-${{ github.run_id }}
      POSTGRES_PASSWORD: ci-placeholder
      POSTGRES_USER: novel
      POSTGRES_DB: novel
      # 密码必须与 POSTGRES_PASSWORD 一致，
      # 否则 compose config 校验会通过，但数据库实际连接失败。
      DATABASE_URL: postgresql://novel:ci-placeholder@postgres:5432/novel?schema=public
      NODE_ENV: production
      # 容器内经 Caddy 的 HTTPS 入口访问；站点名显式写为 localhost（见 Caddyfile），
      # 因此期望来源就是 https://localhost:8443。
      APP_ORIGIN: https://localhost:8443
      # 一次性烟测账号（仅存在于本次 CI 的内存/临时卷中，运行结束即销毁）。
      ADMIN_EMAIL: ci-smoke@example.test
      ADMIN_INITIAL_PASSWORD: Ci-Smoke-Pass-2026

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 corepack 并安装指定 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client 并构建库包
        run: pnpm build:packages

      - name: 构建容器镜像
        run: docker compose -f infra/docker-compose.yml build

      # 全新数据卷上不能直接 `up --wait` 四个服务：
      # 表还没建出来，Worker 的 queueLoop 会停在 retrying（/healthz 503），
      # `--wait` 永远等不到 healthy。因此先把数据库起来、迁移完，再拉起全部服务。
      - name: 启动 PostgreSQL（迁移前只起数据库）
        run: |
          set -euo pipefail
          docker compose -f infra/docker-compose.yml up -d --wait \
            --wait-timeout 120 postgres

      - name: 对容器数据库执行迁移（宿主机连接串）
        env:
          # 宿主机经映射端口访问容器内 PostgreSQL（compose 绑定 127.0.0.1:5432）
          DATABASE_URL: postgresql://novel:ci-placeholder@127.0.0.1:5432/novel?schema=public
        run: |
          set -euo pipefail
          pnpm db:deploy

      - name: 启动四个服务并等待健康
        run: |
          set -euo pipefail
          docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 300

      - name: 验证四个健康检查端点
        run: |
          set -euo pipefail
          bash scripts/verify-healthchecks.sh

      - name: 容器内 argon2 原生模块可用性
        run: |
          set -euo pipefail
          # 直接在被验证的 web 运行层里加载原生模块：失败即镜像不可用。
          docker compose -f infra/docker-compose.yml exec -T web node -e "
            import('@node-rs/argon2')
              .then(async (m) => {
                const hash = await m.hash('smoke-password-value', {
                  algorithm: 2, memoryCost: 19456, timeCost: 2, parallelism: 1, outputLen: 32,
                });
                const ok = await m.verify(hash, 'smoke-password-value', { algorithm: 2 });
                if (!ok) throw new Error('argon2 verify failed');
                console.log('argon2 在容器内可用：' + hash.slice(0, 20) + '...');
              })
              .catch((error) => { console.error(error.message); process.exit(1); });
          "

      - name: 创建初始管理员
        env:
          # 宿主机经映射端口访问容器内 PostgreSQL（compose 绑定 127.0.0.1:5432）
          DATABASE_URL: postgresql://novel:ci-placeholder@127.0.0.1:5432/novel?schema=public
        run: |
          set -euo pipefail
          # 迁移已在「对容器数据库执行迁移」步骤完成，这里只建号，避免重复执行。
          pnpm admin:create

      - name: TLS 前置检查（Caddy internal 证书 + HTTPS 健康检查）
        env:
          BASE: https://localhost:8443
        run: |
          set -euo pipefail
          # 先用 --resolve/--ipv4 明确连 IPv4 环回，确认 Caddy 的 HTTPS 端点可握手。
          # 只要不是 200（含 curl 35 这类 TLS 失败），立即失败并打印 Caddy 日志。
          code="$(curl -sS -k --ipv4 --resolve localhost:8443:127.0.0.1 \
                    -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/api/healthz" || true)"
          if [ "$code" != "200" ]; then
            echo "::error::Caddy HTTPS 健康检查未返回 200（实际：${code:-curl 失败}）"
            docker compose -f infra/docker-compose.yml logs caddy --tail 100 || true
            exit 1
          fi
          echo "[tls] Caddy HTTPS 健康检查 200 ✓"

      - name: 登录烟测（经 Caddy HTTPS）
        env:
          BASE: https://localhost:8443
          ORIGIN: https://localhost:8443
        run: |
          set -euo pipefail
          bash scripts/verify-auth-smoke.sh

      # ---------- 浏览器 E2E（M1-B3） ----------
      - name: 生成 E2E 一次性凭据
        id: e2ecreds
        run: |
          set -euo pipefail
          EMAIL="e2e-admin-${GITHUB_RUN_ID}@example.test"
          PASSWORD="E2e-$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          {
            echo "email=$EMAIL"
            echo "password=$PASSWORD"
          } >> "$GITHUB_OUTPUT"

      # E2E 必须用**两个**连接串：
      # - 宿主机上的 Prisma（db:deploy / admin:create）经端口映射连 127.0.0.1；
      # - 容器内的 web / worker 必须连服务名 `postgres`（容器里 127.0.0.1 指向自己）。
      - name: 为 E2E 创建独立数据库并迁移建号
        env:
          # 库名带 run id 与 attempt：重试/重跑不会撞上已存在的库
          E2E_DB_NAME: novel_e2e_${{ github.run_id }}_${{ github.run_attempt }}
          E2E_HOST_DATABASE_URL: postgresql://novel:ci-placeholder@127.0.0.1:5432/novel_e2e_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
          ADMIN_EMAIL: ${{ steps.e2ecreds.outputs.email }}
          ADMIN_INITIAL_PASSWORD: ${{ steps.e2ecreds.outputs.password }}
        run: |
          set -euo pipefail
          # 必须用**数组**：bash 的变量展开不做分词，
          # "$COMPOSE exec ..." 会把整串当成一个命令名而失败。
          COMPOSE=(docker compose -f infra/docker-compose.yml)

          # E2E 使用与烟测**不同**的数据库，避免账号上限（10）被烟测数据占满。
          # 创建前先检查是否已存在：失败重试时不能因为 "already exists" 再次失败。
          exists="$("${COMPOSE[@]}" exec -T postgres psql -U novel -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname='$E2E_DB_NAME'" | tr -d '[:space:]')"
          if [ "$exists" = "1" ]; then
            echo "[e2e] 数据库 $E2E_DB_NAME 已存在，跳过创建"
          else
            "${COMPOSE[@]}" exec -T postgres psql -U novel -d postgres \
              -c "CREATE DATABASE \"$E2E_DB_NAME\""
            echo "[e2e] 已创建数据库 $E2E_DB_NAME"
          fi

          # 宿主机上的迁移与建号走**宿主机**连接串（127.0.0.1:5432）
          DATABASE_URL="$E2E_HOST_DATABASE_URL" pnpm db:deploy
          DATABASE_URL="$E2E_HOST_DATABASE_URL" pnpm admin:create

      - name: 重建 web 与 worker 指向 E2E 数据库并等待双端健康
        env:
          E2E_DB_NAME: novel_e2e_${{ github.run_id }}_${{ github.run_attempt }}
          E2E_CONTAINER_DATABASE_URL: postgresql://novel:ci-placeholder@postgres:5432/novel_e2e_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
        run: |
          set -euo pipefail
          COMPOSE=(docker compose -f infra/docker-compose.yml)

          # web 与 worker 必须**同时**重建：只重建 web 会让 worker 继续消费默认库，
          # E2E 提交的章节任务永远不会被领取。
          # DATABASE_URL 只传**容器内**连接串（postgres:5432）；Caddy 无需重建。
          DATABASE_URL="$E2E_CONTAINER_DATABASE_URL" \
            "${COMPOSE[@]}" up -d --force-recreate --no-deps \
              --wait --wait-timeout 180 web worker

          # 确认两个容器拿到的连接串一致且指向 E2E 库（输出前脱敏，绝不打印密码）
          mask() { sed -E 's#(://[^:/@]+:)[^@]*@#\1***@#'; }
          web_db="$("${COMPOSE[@]}" exec -T web printenv DATABASE_URL | tr -d '\r')" \
            || { echo "::error::无法读取容器内 web 的 DATABASE_URL"; exit 1; }
          worker_db="$("${COMPOSE[@]}" exec -T worker printenv DATABASE_URL | tr -d '\r')" \
            || { echo "::error::无法读取容器内 worker 的 DATABASE_URL"; exit 1; }
          web_masked="$(printf '%s' "$web_db" | mask)"
          worker_masked="$(printf '%s' "$worker_db" | mask)"
          echo "[e2e] 容器内 web    DATABASE_URL：$web_masked"
          echo "[e2e] 容器内 worker DATABASE_URL：$worker_masked"
          if [ "$web_masked" != "$worker_masked" ]; then
            echo "::error::web 与 worker 的 DATABASE_URL 不一致，E2E 任务不会被同一数据库消费"
            exit 1
          fi
          case "$web_masked" in
            *"$E2E_DB_NAME"*) ;;
            *)
              echo "::error::容器内 DATABASE_URL 未指向 E2E 库 $E2E_DB_NAME"
              exit 1
              ;;
          esac

          # 双端点健康：web 的 /api/healthz 与 worker 的 /worker/healthz 都为 200 才算就绪。
          # 不能只等 web —— worker 的 queueLoop 未 ready 时 /worker/healthz 是 503。
          web_code=""
          worker_code=""
          for _ in $(seq 1 60); do
            web_code="$(curl -sS -k --ipv4 --resolve localhost:8443:127.0.0.1 \
                      -o /dev/null -w '%{http_code}' --max-time 10 \
                      https://localhost:8443/api/healthz || true)"
            worker_code="$(curl -sS -k --ipv4 --resolve localhost:8443:127.0.0.1 \
                      -o /dev/null -w '%{http_code}' --max-time 10 \
                      https://localhost:8443/worker/healthz || true)"
            if [ "$web_code" = "200" ] && [ "$worker_code" = "200" ]; then
              echo "[e2e] web 与 worker 均已指向 E2E 数据库并健康"
              exit 0
            fi
            sleep 2
          done

          echo "::error::重建后的服务未在预期时间内双端健康（web=${web_code:-none} worker=${worker_code:-none}）"
          "${COMPOSE[@]}" ps || true
          "${COMPOSE[@]}" logs web --tail 100 || true
          "${COMPOSE[@]}" logs worker --tail 100 || true
          "${COMPOSE[@]}" logs postgres --tail 100 || true
          exit 1

      - name: 安装 Playwright 浏览器（失败即失败，不允许跳过）
        run: pnpm --filter @novel/web exec playwright install --with-deps chromium

      - name: 浏览器 E2E（真实 Chromium，经 Caddy HTTPS）
        env:
          BASE_URL: https://localhost:8443
          ADMIN_EMAIL: ${{ steps.e2ecreds.outputs.email }}
          ADMIN_INITIAL_PASSWORD: ${{ steps.e2ecreds.outputs.password }}
        run: pnpm --filter @novel/web exec playwright test

      # 失败产物（error-context.md）的可访问性快照会包含密码框的值，
      # 因此上传前必须扫描并剔除含明文口令的文件。
      - name: 扫描并剔除失败产物中的明文口令
        if: always()
        env:
          SECRET_VALUES: ${{ steps.e2ecreds.outputs.password }}
        run: bash scripts/verify-no-plaintext-secrets.sh

      - name: 上传 E2E 截图与失败产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            docs/screenshots
            apps/web/test-results
          if-no-files-found: warn

      - name: 输出容器状态与日志
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml ps || true
          docker compose -f infra/docker-compose.yml logs --tail 100 || true

      - name: 清理本次 CI 创建的容器与卷
        if: always()
        run: |
          set -euo pipefail
          # 保护：只允许清理本次 CI 的项目（novel-ci-*），避免误删其他资源
          case "${COMPOSE_PROJECT_NAME}" in
            novel-ci-*)
              docker compose -f infra/docker-compose.yml down -v --remove-orphans
              ;;
            *)
              echo "::error::COMPOSE_PROJECT_NAME 不是 novel-ci-*，拒绝清理"
              exit 1
              ;;
          esac
