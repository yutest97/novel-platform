name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.2'
  # 必须与 package.json 的 packageManager 字段完全一致
  PNPM_VERSION: '10.34.9'

jobs:
  verify:
    name: 安装 / lint / typecheck / test / build / 许可证
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 认证集成测试需要真实 PostgreSQL（不使用 mock 替代数据库测试）。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novel
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: novel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel -d novel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://novel:ci-placeholder@127.0.0.1:5432/novel?schema=public

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 使用 corepack 安装与 package.json packageManager 完全一致的 pnpm 版本
      - name: 启用 corepack 并安装指定 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 必须先构建库包：web / worker 通过 workspace 依赖引用
      # @novel/shared、@novel/db、@novel/auth 的 dist 产物，
      # lint / typecheck / test 都依赖它。
      - name: 生成 Prisma Client 并构建库包
        run: pnpm build:packages

      # 集成测试直接连真实数据库，必须先应用迁移。
      - name: 应用数据库迁移
        run: pnpm db:deploy

      - name: 校验格式（构建前）
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试与数据库集成测试
        run: pnpm test

      - name: 符号链接分类校验器的行为测试
        run: pnpm test:deploy-symlinks

      - name: 构建应用
        run: pnpm build:apps

      - name: 校验格式（构建后，防止 Next 重写文件导致回归）
        run: pnpm format:check

      - name: 校验构建后 Git 工作区未被污染
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建过程修改了被跟踪文件，请检查 Next/Prisma 是否重写了源文件："
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
          echo "Git 工作区干净 ✓"

      - name: Docker Compose 配置校验
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD=ci-placeholder docker compose -f infra/docker-compose.yml config --quiet
          POSTGRES_PASSWORD=ci-placeholder docker compose -f infra/docker-compose.yml config > /dev/null

      - name: 依赖许可证扫描（生产依赖 + 开发依赖）
        run: |
          set -euo pipefail
          pnpm license:check
          pnpm license:check:dev

      - name: 生成第三方许可证清单
        run: |
          set -euo pipefail
          pnpm license:report
          pnpm license:report:dev

      - name: 上传许可证清单
        uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: |
            THIRD_PARTY_LICENSES.md
            THIRD_PARTY_LICENSES.dev.md

  docker:
    name: 容器构建与端到端健康验证
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    env:
      # 独立 Compose 项目名：容器/网络/卷均带此前缀，
      # 与任何开发环境隔离；down -v 只清理本次运行创建的资源。
      COMPOSE_PROJECT_NAME: novel-ci-${{ github.run_id }}
      POSTGRES_PASSWORD: ci-placeholder
      POSTGRES_USER: novel
      POSTGRES_DB: novel
      # 密码必须与 POSTGRES_PASSWORD 一致，
      # 否则 compose config 校验会通过，但数据库实际连接失败。
      DATABASE_URL: postgresql://novel:ci-placeholder@postgres:5432/novel?schema=public
      NODE_ENV: production
      # 容器内经 Caddy 的 HTTPS 入口访问，因此期望来源就是该地址。
      APP_ORIGIN: https://127.0.0.1:8443
      # 一次性烟测账号（仅存在于本次 CI 的内存/临时卷中，运行结束即销毁）。
      ADMIN_EMAIL: ci-smoke@example.test
      ADMIN_INITIAL_PASSWORD: Ci-Smoke-Pass-2026

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 corepack 并安装指定 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client 并构建库包
        run: pnpm build:packages

      - name: 构建容器镜像
        run: docker compose -f infra/docker-compose.yml build

      - name: 启动四个服务并等待健康
        run: |
          set -euo pipefail
          docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 300

      - name: 验证四个健康检查端点
        run: |
          set -euo pipefail
          bash scripts/verify-healthchecks.sh

      - name: 容器内 argon2 原生模块可用性
        run: |
          set -euo pipefail
          # 直接在被验证的 web 运行层里加载原生模块：失败即镜像不可用。
          docker compose -f infra/docker-compose.yml exec -T web node -e "
            import('@node-rs/argon2')
              .then(async (m) => {
                const hash = await m.hash('smoke-password-value', {
                  algorithm: 2, memoryCost: 19456, timeCost: 2, parallelism: 1, outputLen: 32,
                });
                const ok = await m.verify(hash, 'smoke-password-value', { algorithm: 2 });
                if (!ok) throw new Error('argon2 verify failed');
                console.log('argon2 在容器内可用：' + hash.slice(0, 20) + '...');
              })
              .catch((error) => { console.error(error.message); process.exit(1); });
          "

      - name: 对容器数据库执行迁移并创建初始管理员
        env:
          # 宿主机经映射端口访问容器内 PostgreSQL（compose 绑定 127.0.0.1:5432）
          DATABASE_URL: postgresql://novel:ci-placeholder@127.0.0.1:5432/novel?schema=public
        run: |
          set -euo pipefail
          pnpm db:deploy
          pnpm admin:create

      - name: 登录烟测（经 Caddy HTTPS）
        env:
          BASE: https://127.0.0.1:8443
          ORIGIN: https://127.0.0.1:8443
        run: |
          set -euo pipefail
          bash scripts/verify-auth-smoke.sh

      - name: 输出容器状态与日志
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml ps || true
          docker compose -f infra/docker-compose.yml logs --tail 100 || true

      - name: 清理本次 CI 创建的容器与卷
        if: always()
        run: |
          set -euo pipefail
          # 保护：只允许清理本次 CI 的项目（novel-ci-*），避免误删其他资源
          case "${COMPOSE_PROJECT_NAME}" in
            novel-ci-*)
              docker compose -f infra/docker-compose.yml down -v --remove-orphans
              ;;
            *)
              echo "::error::COMPOSE_PROJECT_NAME 不是 novel-ci-*，拒绝清理"
              exit 1
              ;;
          esac
