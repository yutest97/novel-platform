# 开发模式覆盖文件 —— **不修改默认的 production 运行模式**。
#
# 用途：仅在需要以开发模式（更详细的 Prisma 日志等）运行容器时叠加使用。
#
# 用法：
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up
#
# 说明：
# - 默认的 infra/docker-compose.yml 中 NODE_ENV 为 production。
# - 本文件把 NODE_ENV 覆盖为 development，并关闭 Cookie 的 Secure 标志
#   （仅因本地用 http 访问；生产必须保持 Secure=true）。
# - 不要把本文件当作默认启动方式；CI 与日常验收均使用默认文件（production）。

services:
  web:
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # 本地以 http 访问时浏览器不会保存 Secure Cookie，故开发模式显式关闭；
      # 默认（生产）配置必须保持 AUTH_COOKIE_SECURE=true。
      AUTH_COOKIE_SECURE: 'false'

  worker:
    environment:
      NODE_ENV: ${NODE_ENV:-development}
