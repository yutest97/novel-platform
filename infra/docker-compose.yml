# 本地开发用 Docker Compose —— 仅供本地/内网使用，不部署公网。
#
# 服务：postgres / web / worker / caddy
# 用法：
#   cp .env.example .env
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml config   # 校验

name: novel-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: novel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
      POSTGRES_DB: ${POSTGRES_DB:-novel}
    volumes:
      # 命名持久卷：数据随卷保留，容器销毁不丢。
      - pgdata:/var/lib/postgresql/data
    ports:
      # 仅绑定回环地址，避免数据库暴露到局域网/公网。
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-novel} -d ${POSTGRES_DB:-novel}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app-net

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    container_name: novel-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://novel:change-me-local-only@postgres:5432/novel?schema=public}
      WEB_PORT: ${WEB_PORT:-3000}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app-net

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    container_name: novel-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://novel:change-me-local-only@postgres:5432/novel?schema=public}
      WORKER_PORT: ${WORKER_PORT:-3001}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    ports:
      - '127.0.0.1:${WORKER_PORT:-3001}:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app-net

  caddy:
    image: caddy:2-alpine
    container_name: novel-caddy
    restart: unless-stopped
    depends_on:
      - web
      - worker
    ports:
      # 仅绑定回环地址；Caddy 在本地开发使用自签证书，不申请公网证书。
      - '127.0.0.1:${CADDY_HTTP_PORT:-8080}:80'
      - '127.0.0.1:${CADDY_HTTPS_PORT:-8443}:443'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-net

volumes:
  pgdata:
    name: novel-pgdata
  caddy-data:
    name: novel-caddy-data
  caddy-config:
    name: novel-caddy-config

networks:
  app-net:
    name: novel-app-net
    driver: bridge
