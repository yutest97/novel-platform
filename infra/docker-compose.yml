# 本地容器编排 —— 仅供本地/内网使用，不部署公网。
#
# 服务：postgres / web / worker / caddy
#
# 用法：
#   cp .env.example .env
#   pnpm compose:up        # 启动（等价 docker compose -f infra/docker-compose.yml up -d --wait）
#   pnpm compose:down      # 停止容器，**保留数据卷**
#   pnpm compose:reset     # 停止容器并**删除数据卷**（会丢数据，慎用）
#
# 项目名与资源命名（v1.1 修正）：
# - 顶层 name 使用 COMPOSE_PROJECT_NAME（默认 novel-platform）。
# - **卷名、网络名不再硬编码**，而是带项目名前缀：
#     日常开发 → novel-platform_pgdata
#    验证实例 → novel-verify-<pid>_pgdata（见 scripts/verify-local.sh）
#   这保证验证脚本的 `down -v` 只能删除它自己创建的资源，
#   不会误删日常开发数据卷。
# - 服务不再设置 container_name，由 compose 按项目名自动命名，避免多项目冲突。

name: ${COMPOSE_PROJECT_NAME:-novel-platform}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
      POSTGRES_DB: ${POSTGRES_DB:-novel}
    volumes:
      # 命名持久卷：数据随卷保留，容器销毁不丢。
      - pgdata:/var/lib/postgresql/data
    ports:
      # 仅绑定回环地址，避免数据库暴露到局域网/公网。
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-novel} -d ${POSTGRES_DB:-novel}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app-net

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 容器运行模式默认为 production（v1.1 修正）。
      # 如需开发模式，使用 infra/docker-compose.dev.yml 覆盖，不改默认值：
      #   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://novel:change-me-local-only@postgres:5432/novel?schema=public}
      WEB_PORT: ${WEB_PORT:-3000}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app-net

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 同 web：默认 production，开发模式走 override 文件。
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://novel:change-me-local-only@postgres:5432/novel?schema=public}
      WORKER_PORT: ${WORKER_PORT:-3001}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    ports:
      - '127.0.0.1:${WORKER_PORT:-3001}:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app-net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - worker
    ports:
      # 仅绑定回环地址；Caddy 在本地开发使用自签证书，不申请公网证书。
      - '127.0.0.1:${CADDY_HTTP_PORT:-8080}:80'
      - '127.0.0.1:${CADDY_HTTPS_PORT:-8443}:443'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-net

volumes:
  # 卷名带项目名前缀（不再硬编码），确保不同 compose 项目互不影响。
  # 日常开发：novel-platform_pgdata
  # 验证实例：novel-verify-<pid>_pgdata
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-novel-platform}_pgdata
  caddy-data:
    name: ${COMPOSE_PROJECT_NAME:-novel-platform}_caddy-data
  caddy-config:
    name: ${COMPOSE_PROJECT_NAME:-novel-platform}_caddy-config

networks:
  app-net:
    name: ${COMPOSE_PROJECT_NAME:-novel-platform}_app-net
    driver: bridge
